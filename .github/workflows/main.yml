name: Build RoxoPay APK

on:
workflow_dispatch:
push:
paths:
- '**.zip'
- '.github/workflows/main.yml'

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Download project
uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Build APK
    run: |
      ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
      test -n "$ZIP_FILE"
      mkdir extracted
      unzip -q "$ZIP_FILE" -d extracted
      APP_DIR="extracted/roxopay_android_online/android"
      sed -i 's|https://COLOQUE-AQUI-SEU-SERVIDOR|https://roxopay-server.onrender.com|g' "$APP_DIR/app/src/main/java/com/roxopay/demo/MainActivity.java"
      cd "$APP_DIR"
      gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: RoxoPay-debug-apk
      path: extracted/roxopay_android_online/android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
